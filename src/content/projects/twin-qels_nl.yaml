    - type: text-block
      content:
        text: >
          Human Software - TwinQels maakt gesprekken in organisaties gemakkelijker en beter. Medewerkers werken met een app die ondersteunt bij reflectie, ontwikkeling en werkgeluk. TwinQels biedt de basis voor eigen regie. Werkgevers kunnen op deze manier gesprekken voeren met goed voorbereide medewerkers die weten wat ze willen. Bovendien is er voor HR een (anoniem) dashboard met relevante HR-analytics. Organisaties weten wat er leeft en kunnen hierop actie ondernemen.
