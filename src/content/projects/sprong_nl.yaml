projectId: "sprong"
page:
  title: "Sprong VuMC"
  sections:
    - type: "hero-media"
      content:
        image:
          url: "/images/projects/sprong/hero.jpg"
    - type: "meta-info-row"
      content:
        - label: "Datum"
          value: "Juli 2019"
        - label: "Opdrachtgever"
          value: "Onconet, VUmc"
        - label: "Rol"
          value: "UI/UX/App/Prototype<br>Huisstijl"

    - type: "text-block"
      content:
        text: >
          Mensen met borstkanker die tijdens de chemotherapie een begeleid oefenprogramma volgen, kunnen hun fysieke conditie behouden, vermoeidheid en andere klachten beperken en de kans op afronding van de chemotherapie vergroten. Bij Onconet in het VUmc geven ze deze begeleide oefenprogramma's, ook wel oncofysio genoemd. Op dit moment hebben de fysiotherapeuten en de patiënt papieren waarop ze gegevens invullen. Hoe ze zich voelen, welke klachten ze hebben, welke activiteit ze hebben gedaan en meer. Voor dit project wilden we alle gegevens combineren in een eenvoudige app, zodat je een mooi overzicht hebt van je voortgang.
    - type: "quote-block"
      content:
        text: >
          “Hoe kunnen we **mensen met borstkanker** meer controle geven over hun **trainingsprogramma** en de communicatie van **data** met hun **fysiotherapeut** verbeteren middels een aantrekkelijke service?”
    - type: "full-image"
      content:
        url: "/images/projects/sprong/sprong-fullpage-moodboard.jpg"
        alt: 'Concept Moodboard. "Inviting, Motivating and Happy."'
        label: "Moodboard"
        width: grid-6
    - type: "text-block"
      content:
        text: >
          Voor dit project hebben we veel onderzoek gedaan voordat we het eindproduct maakten. We hebben fysiotherapiesessies bezocht met onze eindgebruikers (mensen met borstkanker). We hebben veel mindmaps gemaakt, data verzameld en UX-flows geschreven. Daarna hebben we ons ontwerp getest met eindgebruikers en in meerdere iteraties verbeterd.
    - type: image-mosaic
      content:
        columns:
          #column 1
          - images:
              - url: /images/projects/sprong/2P1110209.jpg
                alt: ""
              - url: /images/projects/sprong/apr26afinitydiagram.jpg
                alt: Post-Its based affinity diagram
          #column 2
          - images:
              - url: /images/projects/sprong/mrt15stakeholdermap.jpg
                alt: "Stakeholder map"
              - url: /images/projects/sprong/tumblr_ppula21SJ81y8563ko3_1280.jpg
                alt: Saskia smiling in a lab coat.
          #column 3
          - images:
              - url: /images/projects/sprong/mrt14ideasfunctions5.jpg
                alt: Concepts on whiteboard
              - url: /images/projects/sprong/mrt7contextmap2.jpg
                alt: A big, multicolored contextmap. "Where?, When?, How?, Why?, What?, Who?"
        label: "Het proces; Mind maps, field research, user flows en meer"
    - type: "text-block"
      content:
        text: >
          Stel je voor dat je een coach hebt die naar je luistert, je een persoonlijk doel stelt dat je kunt bereiken en je motiveert tijdens je reis. Je vindt dit allemaal in de app.
