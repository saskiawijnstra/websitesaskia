          FysioVries is een fysiotherapiepraktijk gevestigd in Vries. FysioVries streeft naar het beste resultaat voor haar cliënten. Kwaliteit, kleinschaligheid, goede service en persoonlijke aandacht staan ​​bij FysioVries hoog in het vaandel. Dit doen zij in een vertrouwelijke en betrokken sfeer.
