projectId: "whatsuper"
page:
  title: "whatsuper"
  sections:
    - type: "hero-media"
      content:
        image:
          url: "/images/projects/whatsuper/hero.jpg"
    - type: "meta-info-row"
      content:
        - label: "Datum"
          value: "September 2021"
        - label: "Opdrachtgever"
          value: "Whatsuper"
        - label: "Rol"
          value: "UI/UX/App/Prototype<br>Huisstijl"

    - type: "text-block"
      content:
        text: >
          Een develeper vroeg me om een app te ontwerpen waarin hij alle kortingen van alle supermarkten in Nederland kon vinden. Hij zou de code schrijven en had voor de app een ontwerper nodig om zijn idee visueel, begrijpelijk en logisch te maken.
          <br><br>
          Voor het ontwerp koos ik voor lichte kleuren en een open, gemakkelijk leesbaar lettertype. De prijs en belangrijke informatie zijn opvallend rood. De achtergrond is lichtblauw voor een rustige sfeer en om de aandacht op de producten te vestigen. Wat ik erg leuk vond aan het ontwerpen van deze app, was uitzoeken hoe ik hem zo strak en duidelijk mogelijk kon maken, met alle aanbiedingen en teksten die erin moesten.
    - type: "color-swatch-row"
      content:
        - color: "#F84C3E"
        - color: "#86C724"
        - color: "#5EBEF5"
    - type: "quote-block"
      content:
        text: >
          “Alle **supermarktaanbiedingen** in **één overzicht**. Met een licht en overzichtelijk design helpt de app je de **beste aanbiedingen** voor **dagelijkse producten** te vinden.”
    - type: "full-image"
      content:
        url: "/images/projects/whatsuper/whatsuper_flow.png"
        alt: "Prototype Userflow in Figma (not all lines are visible). The whole prototype was clickable"
        label: "Prototype Userflow in Figma (niet alle lijnen zijn zichtbaar)<br>Het hele prototype is klikbaar"
        width: grid-6
    - type: "text-block"
      content:
        text: >
          Voor het ontwerp heb ik nagedacht over leuke functies voor de app.
          Bijvoorbeeld om de verschillende supermarkten te selecteren waar je naartoe gaat of een melding te krijgen als er iets te koop is wat je vaker gebruikt.
          Ik heb ook een prototype gemaakt van het scrollen in de pagina's en hoe de overgangen tussen de pagina's werken. Om het logisch te maken voor de gebruiker waar je je in de app bevindt.
          De app staat in de Play Store. Je kunt hem zelf downloaden. Hieronder vind je mijn definitieve ontwerpen.

    # maybe this should be a "app screens grid" block instead of one image, for better responsiveness.
    # but its okay for now
    - type: "full-image"
      content:
        url: /images/projects/whatsuper/whatsuper_schermen.png
        alt: A collection of the app's screenshots.
        width: grid-10
