    - type: text-block
      content:
        text: >
          SEIN is hét expertisecentrum voor epilepsie- en slaapgeneeskunde. Samen met een UX-designer mocht ik de website volledig herbouwen. Voor deze doelgroep moesten we vooral een website maken die leesbaar, overzichtelijk en rustig was. Deze website is volledig tijdens de pandemie gemaakt. We hebben dus alle presentaties online met de klant gedaan en helaas bij SEIN langs geweest.
