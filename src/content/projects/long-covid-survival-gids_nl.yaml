page:
  title: "Long Covid Survival Gids"
  sections:
    - type: "hero-media"
      content:
        image:
          url: "/images/projects/long-covid-survival/hero-image.jpg"
          alt: "Screenshots and social media posts of the instagram profile 'Long covid survival gids'"
    - type: "meta-info-row"
      content:
        - label: "Datum"
          value: "2022 - 2023"
        - label: "Instagram"
          value: "@longcovid.survival.gids"
          link: "https://www.instagram.com/longcovid.survival.gids/" # link is optional value
        - label: "Rol"
          value: "Content creator, Designer"

    - type: "text-block"
      content:
        text: >
          In oktober 2020 kreeg ik covid. Terwijl anderen na ongeveer twee weken herstelden, herstelde ik niet. Ik had het helemaal koud. Je kon een warmtelamp op me zetten en me inwikkelen met dekens, maar ik werd niet warm. Ik had geen energie. Uitputting is een understatement. Drie maanden lang had ik geen reuk of smaak, die kwamen gelukkig terug. Maar andere klachten werden erger. Ik kon geen prikkels, geluid, licht, enzovoort verdragen. Het eerste jaar probeerde ik nog 50% te werken, maar dat werd te veel. Ik heb allerlei behandelingen geprobeerd: fysiotherapie, ergotherapie, meerdere revalidaties, hyperbare zuurstoftherapie, H.E.L.P.-aferese, te veel om op te noemen. Maar mijn klachten (een lijst van twee pagina's lang) werden erger. Ik ging van bed naar bank. Douchen, eten maken, 5 meter lopen was te veel. Mijn lichaam was op.
          <br><br>
          Om toch nog wat te ontwerpen, ben ik een Instagrampagina begonnen. Voor lotgenoten. Om elkaar te helpen en uitleg te geven over long covid. Ik kreeg veel reacties, voelde de verbinding met anderen in mijn isolement en het gaf me een beetje betekenis.
    - type: "image-row-4-tilted"
      content:
        - image: "/images/projects/long-covid-survival/wegvandepijn.png"
          alt: "Weg van de Pijn book omslag"
          rotation: -5
        - image: "/images/projects/long-covid-survival/masterclass.png"
          alt: "Audience in talk"
          rotation: 3
        - image: "/images/projects/long-covid-survival/retraite.png"
          alt: "Garden view"
          rotation: -5
        - image: "/images/projects/long-covid-survival/thewayout.png"
          alt: "The Way Out book cover"
          rotation: 5
    - type: "text-block"
      content:
        text: >
          In 2023 vond ik het boek; Weg van de Pijn - Saskia de Bruin. Andere mensen met long covid of chronische klachten waren hersteld met behulp van de tms/mindbody-visie. Toen ik het las, viel er veel op zijn plaats. Ik voelde weerstand, maar meer nieuwsgierigheid naar deze methode. Ik voelde symptomen verdwijnen wanneer ik het toepaste. Het ging met vallen en opstaan, maar ik had eindelijk iets gevonden wat voor mij werkte.
          <br><br>
          Ik ging naar een retraite van Nina Bosselaar (Lief Klein Leven) en volgde een masterclass van Howard Schubiner (Neurowetenschappers). Ik las het boek; The way out - Alan Gordon. Ik verdiepte me volledig in de mind body-visie. Ik deed en doe nog steeds yin yoga om te ontspannen. En stap voor stap maakte ik mijn wereld weer groter door nieuwe neurale paden aan te leggen.
    - type: "image-row"
      column-count: 3
      content:
        images:
          - image:
              url: "/images/projects/long-covid-survival/neuralepaden.jpg"
              alt: "Social Media Post Hersenen"
          - image:
