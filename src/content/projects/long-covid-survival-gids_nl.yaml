          - image:
              url: "/images/projects/long-covid-survival/gradient.jpg"
              alt: "Social Media Post 'Gradient Slider'"
    - type: "quote-block"
      content:
        text: >
          “Van **overleven** naar **leven**. Hoe ik herstelde van long covid met de **mindbody-visie**. **Nieuwe neurale paden** maken met **vertrouwen, zelfcompassie, moed en doorzettingsvermogen**.”
    - type: "text-block"
      content:
        text: >
          Ik ben hersteld van long covid. Gezond en vol energie. Maar ik blijf mijn werk en sport opbouwen. Ik pas de mindbody-visie toe. Ik ben super dankbaar dat ik deze methode heb gevonden. En trots op de moed en het doorzettingsvermogen die ik heb om het vertrouwen in mijn lichaam en mezelf terug te vinden.
          <br><br>
          Op mijn Instagrampagina vind je deze reis en de inzichten die ik onderweg heb opgedaan. Het ontwerp is strak, eenvoudig, open en zacht. Makkelijk te lezen. Inzichtelijk met de illustraties. Neem gerust contact met me op als je vragen hebt.
