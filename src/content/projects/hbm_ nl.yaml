    - type: "text-block"
      content:
        text: >
          Voor mijn afstudeeropdracht van de bachelor Multimedia, Concepting en Design werkte ik namens Snakeware voor Hans Boodt Mannequins. Snakeware is een digitaal bureau uit Sneek en een van hun klanten is Hans Boodt Mannequins (HBM). Hans Boodt Mannequins ontwerpt, produceert en verkoopt eigentijdse, krachtige etalagefiguren, oftewel mannequins. 
          <br><br>
          Klanten van HBM zijn veelal merkbewuste retailers of visual merchandisers. Voor hen is het vaak moeilijk om zich voor te stellen hoe de mannequin er in het echt uit zal zien. Het maken en produceren van mannequins is een dure en tijdrovende klus. Als opdrachtgever én als klant wil je voorkomen dat het je extra tijd en geld kost. Je wilt de kans op miskopen minimaliseren. Het is daarom belangrijk dat de klant de mannequin zo goed mogelijk kan zien om het verschil met de werkelijkheid te voorkomen. Om dit probleem op te lossen, is HBM in gesprek gegaan met Snakeware. Zij hebben het idee bedacht voor een Augmented Reality (AR) app. Virtuele beelden, in dit geval de mannequins, worden aan de werkelijkheid toegevoegd. Tijdens deze afstudeeropdracht heb ik het prototype gerealiseerd. In deze afstudeeropdracht wordt de volgende vraag beantwoord:
    - type: "quote-block"
      content:
        text: >
          “Op welke manier kan **Augmented Reality** bijdragen aan een **efficiëntere beoordeling van mannequins** met behulp van een **digitaal interactief product**?””
    - type: swipe-gallery
      height: 367
