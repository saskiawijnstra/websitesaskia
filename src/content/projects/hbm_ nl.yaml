    - type: "text-block"
      columns: 2
      content:
        width: grid-8
        # We use <p> wrappers for the paragraphs here, because line-breaks with <br> can cause columns to start with empty lines
        text: >
          <p>
          Klanten wegen de voordelen en nadelen van een product tegen elkaar af. De kunst is om de voordelen te maximaliseren en de nadelen zo klein mogelijk te maken, zodat de klant een grote klantwaarde van het product inziet. In veel situaties zijn de nadelen doorslaggevend in het keuzeproces van de klant. De keuze moet daarom zo eenvoudig mogelijk gemaakt worden voor de gebruiker.
          </p>
          <p>
          Fouten worden vaak gemaakt tijdens het besluitvormingsproces, de klant had achteraf een andere keuze willen maken. Het ontwerp moet er daarom voor zorgen dat de klant zo min mogelijk fouten kan maken. Wat hierbij ook kan helpen, is de klant voldoende informatie over het product te geven, zodat hij een goede keuze kan maken.
          </p>
          <p>
          De mode-industrie ontwikkelt zich razendsnel. Een van de nieuwste trends is een groot lettertype gecombineerd met een klein lettertype. Je kunt ook gewaagd zijn met kleuren. Felle kleuren worden gebruikt en kleurverlopen zijn in. In de mode-industrie wordt ook veel minimalistischer design toegepast.
          </p>
          <p>
          Een eenvoudig gestroomlijnd ontwerp is gemakkelijk te begrijpen voor de gebruiker, ziet er aantrekkelijk uit en geeft de ontwerper de ruimte om te spelen met weinig content.
          Animaties worden steeds vaker in het ontwerp opgenomen en verhogen de gebruiksvriendelijkheid.
          De gebruiker moet zich goed kunnen oriënteren in AR. Hij moet altijd iets kunnen "zien" en de schaal van het ontwerp moet duidelijk zijn. Er moet rekening mee worden gehouden dat het ontwerp intuïtief en vertrouwd blijft.
          </p>
          <p>
          Augmented Reality is een vrij nieuwe techniek, waarvoor nog niet veel ontwerprichtlijnen zijn opgesteld. Belangrijk is dat we kijken naar de 'echte wereld'. We zijn gewend dit te zien en als het ontwerp reageert op de 'echte wereld', wordt het voor de gebruiker gemakkelijker te begrijpen. Instructies en aanwijzingen kunnen hierbij helpen. Als het ontwerp 360 graden en diepte bevat, lijkt het meer op de 'echte wereld' en wordt de Augmented Reality-ervaring als echt en comfortabel ervaren. 
          </p>
