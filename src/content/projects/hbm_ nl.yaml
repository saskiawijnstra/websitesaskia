    - type: text-block
      content:
        text: >
          Het prototype is uiteindelijk getest door middel van een veldproef met de hardopdenkmethode. 11 proefpersonen hebben opdrachten gemaakt en vervolgens vragen beantwoord. Volgens de proefpersonen werd de app als intuïtief en gebruiksvriendelijk ervaren. Er waren een aantal verbeterpunten, maar over het algemeen vonden de proefpersonen dat ze de opdrachten goed konden uitvoeren.
          Uiteindelijk waren 18 van de 22 ontwerpvoorwaarden goed in het ontwerp verwerkt.
          <br>
          <br>
          De resultaten van de testen laten zien dat het prototype aansluit bij de behoeften van de gebruikers. Het prototype kan zeker bijdragen aan een efficiëntere beoordeling van de mannequins. Dankzij Augmented Reality ontstaat er een veel beter beeld van de mannequin, waardoor de klant het product beter kan beoordelen.
