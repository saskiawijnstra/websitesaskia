    - type: text-block
      content:
        text: >
          Met de Augmented Reality app van Hans Boodt Mannequins kun je alle collecties bekijken, een snelle quiz doen om je keuze makkelijker te maken of een mannequin uit de catalogus scannen. Heb je een op maat gemaakte mannequin? Dan kun je het ontwerp ook in de app bekijken en goedkeuren. Alle mannequins kunnen in 3D en AR worden weergegeven. In de 3D/AR-omgeving kun je de mannequin bekijken en naar wens in de ruimte plaatsen. Hier zijn verschillende opties, waaronder het bekijken van informatie of het aanpassen van de kleur van de mannequin.
           <br>
           <br>
          Ik heb verschillende methoden gebruikt om het prototype te maken. Eerst heb ik moodboards gemaakt om het ontwerp een beeld te geven. Vervolgens heb ik een interactiemodel gemaakt dat laat zien welke kant de klant op zal lopen met en zonder de Augmented Reality app. Ik heb een taakanalyse gemaakt van ontwerpvoorwaarden, brainstormsessies, interviews en enquêtes. Hier zie je welke functies in de app moeten worden opgenomen. Van de taakanalyse is een papieren prototype gemaakt. Het papieren prototype is getest op functionaliteiten voor een snelle evaluatie. Bij de snelle evaluatie is de hardopdenkmethode gebruikt om de grote knelpunten uit het prototype te halen. Deze feedback is meegenomen in het UX-ontwerp en het UI-ontwerp. Om een ​​goed overzicht van de app te krijgen, is het UX-ontwerp gemaakt in een gebruikersstroom. De gebruikersstroom geeft een goed inzicht in de app. Nadat alle schermen duidelijk waren, heb ik de app klikbaar gemaakt in het programma ProtoPie. Zo kan je door alle schermen lopen en een goed beeld krijgen van de uiteindelijke app.
