    - type: "meta-info-row"
      content:
        - label: "Datum"
          value: "December 2018"
        - label: "Instagram"
          value: "VodafoneZiggo"
          link: https://example.org # @saskia: insert correct url here if you want to link the channel
        - label: "Rol"
          value: "Design"
    - type: text-block
      content:
        text: >
          Tijdens de Master Digital Design was mijn eerste groepsproject voor VodafoneZiggo. Tegenwoordig gebruiken we enorm veel data. Er zijn zelfs onbeperkte abonnementen. Maar het netwerk is niet onbeperkt, we bereiken een bepaalde capaciteit. Op een gegeven moment, als we niets doen, is de capaciteit vol. Onze klant bij VodafoneZiggo wilde dit duidelijk maken aan het senior management. Tijdens zijn presentatie kwam het niet over. We maakten het visueel met twee verschillende spellen, zodat je de urgentie voelt.
          <br><br>
          Hierboven zie je het eerste spel. Je tekent lijnen op een interactief bord van het datacenter naar de huizen. Vervolgens vragen de huizen om meer data. Je moet steeds meer lijnen tekenen. Steeds sneller. Er komen obstakels op je pad en sommige huizen krijgen niet de data die ze vragen. Kijk hoe ver je komt.
    - type: swipe-gallery
      height: 465
      content:
        images:
          - url: /images/projects/vodafone-ziggo/slider-2/group1.png
            alt: Game Graphic
          - url: /images/projects/vodafone-ziggo/slider-2/vz-ideation2.png
            alt: Game score screen "Congratulations"
          - url: /images/projects/vodafone-ziggo/slider-2/group2.png
