  sections:
    - type: "quote-block"
      content:
        text: >
          “Hoe kunnen we het senior management van **VodafoneZiggo** duidelijk maken dat de **exponentieel groeiende vraag naar data** de **capaciteit** van het netwerk zal overtreffen als ze niet met **spoed** handelen?”
    - type: swipe-gallery
      height: 551
