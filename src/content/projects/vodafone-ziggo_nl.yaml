          - url: /images/projects/vodafone-ziggo/slider-2/vz-ideation1.png
            alt: Game score board list
          - url: /images/projects/vodafone-ziggo/slider-2/vz-firstnotes.png
            alt: Game start screen
    - type: text-block
      content:
        text: >
          De tweede game is een interactieve stad. Je hebt een bepaalde hoeveelheid data en geld om aan deze stad te besteden. Terwijl je vragen beantwoordt, neem je beslissingen. Na een beslissing krijg je feedback. Het geeft je inzicht in hoe een datanetwerk werkt.
