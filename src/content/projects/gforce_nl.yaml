projectId: "gforce"
page:
  title: "G-Force"
  sections:
    - type: "hero-media"
      content:
        image:
          url: "/images/projects/g-force/g-force-fullpage1.png"
    - type: "meta-info-row"
      content:
        - label: "Datum"
          value: "Juni 2017"
        - label: "Opdrachtgever"
          value: "G-Force Capital"
        - label: "Rol"
          value: "Huisstijl / Website"
        - label: Website
          value: g-force.nl
          link: https://g-force.nl # @saskia site seems to be offline?

    - type: "full-image"
      content:
        url: "/images/projects/g-force/g-force-fullpageoverlap.png"
        alt: "G-Force Capital Logos in donker en licht kleur schema"
        width: grid-10
    - type: "full-image"
      content:
        url: "/images/projects/g-force/g-force-fullpage2.png"
        alt: "G-Force Capital Logos iconen"
        width: grid-10
    - type: text-block
      content:
        text: >
          G-Force Capital is een investeringsfonds voor startups waarbij 'ICT' of 'digitaal' de kern van hun propositie vormt. De G in G-Force staat voor Groningen. Het investeringsfonds staat voor eerlijk, transparant, snel, duidelijk, nuchter en noordelijk. Dit heb ik zoveel mogelijk verwerkt in het logo en de website.
    - type: "image-row"
      column-count: 3
      content:
        images:
          - image:
              url: "/images/projects/g-force/g-force-schetswit1.png"
              alt: "Handgeschreven Design Schetsen"
          - image:
              url: "/images/projects/g-force/g-force-schetswit2.png"
              alt: "Handgeschreven Design Schetsen"
          - image:
              url: "/images/projects/g-force/g-force-schetswit2.png"
              alt: "Handgeschreven Design Schetsen"
        label: "Schetsen"
    - type: quote-block
      content:
        text: >
          “G-Force **investeert** niet in dromen, maar in **veelbelovende plannen** van veelbelovende ondernemers.”
        quotee: "- Marco de Jong, G-Force"
    - type: full-image
      content:
        url: /images/projects/g-force/g-force-website.png
        alt: Screenshot van de G-Force website
    - type: text-block
      content:
        text: >
          Tijdens de start van G-Force Capital was er een grote opening om het logo en de website te onthullen. Het was een erg leuke dag met investeerders, start-ups, collega's en meer.
    - type: full-image
      content:
        url: /images/projects/g-force/g-force-fullpage3.png
        alt: G-Force logo onthulling event.
